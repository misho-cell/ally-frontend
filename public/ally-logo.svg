    <ellipse cx="92"  cy="140" rx="76" ry="94" stroke="#EDEBE4" stroke-width="17"/>
    <ellipse cx="118" cy="140" rx="71" ry="92" stroke="#D9D6CC" stroke-width="16"/>
    <ellipse cx="144" cy="140" rx="66" ry="90" stroke="#4C9A6E" stroke-width="16"/>
    <ellipse cx="168" cy="140" rx="60" ry="88" stroke="#2E5C41" stroke-width="15"/>
    <ellipse cx="190" cy="140" rx="54" ry="86" stroke="#23261F" stroke-width="15"/>
  </g>
</svg>
